# Exact-version lock of requirements-dev.txt (which itself includes
# requirements.txt), resolved in a clean venv on 2026-08-15. CI and the
# README quick-start install from this file (`pip install -r
# requirements.lock`) so a clean checkout gets byte-identical dependency
# versions; the ranged files remain the human-edited source. (Railway's
# Nixpacks build installs the runtime-only requirements.txt, whose upper
# bounds keep it within the same tested majors.) Regenerate after editing
# either ranged file:
#
#   python -m venv /tmp/lockenv && . /tmp/lockenv/bin/activate
#   pip install -r requirements-dev.txt && pip freeze > requirements.lock
#   (then re-add this header)
#
# tzdata is a Django dependency only on Windows; pinning it everywhere is
# harmless and keeps the file platform-independent.
